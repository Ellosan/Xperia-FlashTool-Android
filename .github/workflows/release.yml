name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Signing material comes from repository secrets. Without them the build still
      # produces an APK, just an unsigned one that Android will refuse to install.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret — the release APK will be unsigned."
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Name the artifact after the tag
        id: artifact
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # On a tag push the ref name is the tag; on a manual dispatch the ref name is the
          # branch, so the explicit input wins there.
          TAG="$INPUT_TAG"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          NAME="xperia-flashtool-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify the APK is signed
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            "${{ steps.artifact.outputs.name }}" \
            || echo "::warning::The release APK is not signed — set the keystore secrets."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target creates the tag at this commit when it does not exist yet, which is what
          # happens on a manual dispatch; it is ignored when the tag already exists.
          gh release create "${{ steps.artifact.outputs.tag }}" \
            "${{ steps.artifact.outputs.name }}" \
            --title "${{ steps.artifact.outputs.tag }}" \
            --notes-file .github/release-notes.md \
            --target "$GITHUB_SHA" \
            --prerelease
